name: Version

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASEBOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASEBOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          # Full history so changeset can read the log for changelog entries
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # When changeset files exist on main, this opens/updates a "Version Packages" PR
      # that bumps package.json and writes CHANGELOG.md.  Merging that PR is the release
      # trigger — the step below then creates the git tag that fires the release workflow.
      - uses: changesets/action@v1
        with:
          version: npm run changeset:version
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Create a vX.Y.Z tag only when this commit actually bumped the version field in
      # package.json — i.e. the merge of a Version Packages PR.  Gating on the diff
      # prevents a tag (and therefore a release build) from firing on unrelated pushes,
      # first-run of the workflow, or if a tag was manually deleted.
      - name: Tag release
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # Check that this commit changed the "version" line in package.json.
          # HEAD~1 is the main-branch tip before this push; works for both merge
          # commits and squash-merges.  Skips gracefully if there is no parent
          # commit (e.g. initial commit on an empty repo).
          if git rev-parse HEAD~1 >/dev/null 2>&1 \
            && git diff HEAD~1 HEAD -- package.json | grep -q '^+  "version"'; then

            if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
              echo "Tag v${VERSION} already exists — skipping"
            else
              git tag "v${VERSION}"
              git push origin "v${VERSION}"
              echo "Tagged v${VERSION}"
            fi
          else
            echo "No version bump in this commit — skipping tag"
          fi
