<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Idle state: view is 8px wide, handle fills it */
    #handle {
      position: absolute;
      top: 0; bottom: 0;
      left: 0;
      width: 8px;
      cursor: ew-resize;
      background: #2d2d4e;
      border-left: 1px solid #4a4a7a;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, border-color 0.1s;
    }
    #handle:hover {
      background: #3d3d6e;
      border-left-color: #7c3aed;
    }
    /* During drag the body covers the full window; cursor applies everywhere */
    body.dragging {
      cursor: ew-resize;
    }
    body.dragging #handle {
      /* Handle stays pinned via JS-set 'left' — highlight it during drag */
      background: #3d3d6e;
      border-left-color: #7c3aed;
    }
    #dots {
      display: flex;
      flex-direction: column;
      gap: 3px;
      pointer-events: none;
    }
    .dot {
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #6b6b9a;
    }
  </style>
</head>
<body>
  <div id="handle">
    <div id="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
  <script>
    var MIN_PANEL_WIDTH = 320; // canonical value: shared/constants.ts MIN_PANEL_WIDTH
    var panelId = null;
    var panelWidth = 0;
    var isDragging = false;
    var startScreenX = 0;
    var startWidth = 0;
    var handle = document.getElementById('handle');

    window.resizeAPI.onInit(function(pid, width) {
      panelId = pid;
      panelWidth = width;
    });

    // ── Drag start ──────────────────────────────────────────────────────────
    handle.addEventListener('mousedown', function(e) {
      if (e.button !== 0 || !panelId) return;
      isDragging = true;
      startScreenX = e.screenX;
      startWidth = panelWidth;

      // Pin the handle bar at its current screen position so it stays
      // visible when the view expands to cover the full window.
      handle.style.left = startWidth + 'px';

      document.body.classList.add('dragging');
      window.resizeAPI.startDrag(panelId);
      e.preventDefault();
    });

    // ── Drag move ───────────────────────────────────────────────────────────
    document.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      var delta = e.screenX - startScreenX;
      var newWidth = Math.max(MIN_PANEL_WIDTH, startWidth + delta);
      // Keep the visual bar tracking the drag position
      handle.style.left = newWidth + 'px';
      window.resizeAPI.resize(panelId, newWidth);
    });

    // ── Drag end ────────────────────────────────────────────────────────────
    document.addEventListener('mouseup', function(e) {
      if (!isDragging || e.button !== 0) return;
      isDragging = false;
      document.body.classList.remove('dragging');

      var delta = e.screenX - startScreenX;
      var newWidth = Math.max(MIN_PANEL_WIDTH, startWidth + delta);
      panelWidth = newWidth;

      // Reset handle to fill the (now-shrunk-back) 8px view
      handle.style.left = '0';

      window.resizeAPI.endDrag(panelId, newWidth);
    });
  </script>
</body>
</html>
