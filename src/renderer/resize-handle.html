<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    /* The visible 8px drag bar — matches the view width in idle state */
    #handle {
      width: 100%;
      height: 100%;
      cursor: ew-resize;
      background: #2d2d4e;
      border-left: 1px solid #4a4a7a;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, border-color 0.1s;
    }
    #handle:hover, body.dragging #handle {
      background: #3d3d6e;
      border-left-color: #7c3aed;
    }
    /* During drag, body covers the expanded full-window view with just a cursor */
    body.dragging {
      cursor: ew-resize;
      background: transparent;
    }
    body.dragging #handle {
      /* Hide the narrow bar visually during full-screen drag mode */
      /*display: none;*/
    }
    #dots {
      display: flex;
      flex-direction: column;
      gap: 3px;
      pointer-events: none;
    }
    .dot {
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #6b6b9a;
    }
  </style>
</head>
<body>
  <div id="handle">
    <div id="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
  <script>
    var panelId = null;
    var panelWidth = 0;
    var isDragging = false;
    var startScreenX = 0;
    var startWidth = 0;
    var handle = document.getElementById('handle');

    // Receive current panel identity and width from main process
    window.resizeAPI.onInit(function(pid, width) {
      panelId = pid;
      panelWidth = width;
    });

    // ── Drag start ──────────────────────────────────────────────────────────
    handle.addEventListener('mousedown', function(e) {
      if (e.button !== 0 || !panelId) return;
      isDragging = true;
      startScreenX = e.screenX;
      startWidth = panelWidth;
      document.body.classList.add('dragging');
      // Tell main to expand this view to full-window width
      window.resizeAPI.startDrag(panelId);
      e.preventDefault();
    });

    // ── Drag move (fires on the full-window expanded view) ──────────────────
    document.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      var delta = e.screenX - startScreenX;
      var newWidth = Math.max(320, startWidth + delta);
      window.resizeAPI.resize(panelId, newWidth);
    });

    // ── Drag end ────────────────────────────────────────────────────────────
    document.addEventListener('mouseup', function(e) {
      if (!isDragging || e.button !== 0) return;
      isDragging = false;
      document.body.classList.remove('dragging');
      var delta = e.screenX - startScreenX;
      var newWidth = Math.max(320, startWidth + delta);
      panelWidth = newWidth;
      window.resizeAPI.endDrag(panelId, newWidth);
    });
  </script>
</body>
</html>
