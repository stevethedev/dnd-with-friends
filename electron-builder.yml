appId: com.dndwithfriends.app
productName: DnD With Friends
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!**/*.{map,md}"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: resources/icon.icns
  category: public.app-category.games
linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
